AWSTemplateFormatVersion: "2010-09-09"

Description: The Lab 4 table and the Seatwork 3 site of acsad-g09

Resources:
  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: umak-elec3-acsad-g09-messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: course
          Value: elec3
        - Key: group
          Value: acsad-g09

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: umak-elec3-acsad-g09-linktree
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: course
          Value: elec3
        - Key: group
          Value: acsad-g09

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/*"
